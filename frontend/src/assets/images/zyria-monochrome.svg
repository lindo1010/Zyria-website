<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <title>Zyria Monochrome Logo</title>
  <desc>Zyria horizontal monochrome logo — icon and wordmark in black</desc>
  <rect width="400" height="120" fill="white"/>
  <!-- Icon -->
  <circle cx="44" cy="30" r="9" fill="#1A1A1A" />
  <circle cx="70" cy="48" r="6" fill="#555555" />
  <circle cx="57" cy="67" r="6" fill="#555555" />
  <circle cx="84" cy="84" r="9" fill="#1A1A1A" />
  <line x1="53" y1="38" x2="66" y2="46" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="54" x2="59" y2="64" stroke="#555555" stroke-width="2" stroke-linecap="round"/>
  <line x1="62" y1="72" x2="76" y2="80" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="40" x2="76" y2="78" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.3"/>
  <circle cx="64" cy="57" r="36" fill="none" stroke="#1A1A1A" stroke-width="1" opacity="0.15"/>
  <!-- Wordmark -->
  <text x="112" y="67" font-family="sans-serif" font-size="42" font-weight="500" letter-spacing="-0.5" fill="#1A1A1A">Zyria</text>
  <text x="113" y="86" font-family="sans-serif" font-size="10" font-weight="400" letter-spacing="2.5" fill="#555555">DIGITAL SOLUTIONS</text>
</svg>
